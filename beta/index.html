<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>DCAP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="2;url=../">
<script>
  // Bêta retirée (20/10/2026) : on désinscrit son service worker, on vide ses caches, puis on ouvre l'app principale.
  (function () {
    var go = function () { location.replace('../'); };
    var jobs = [];
    if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.filter(function (r) { return /\/beta\/$/.test(r.scope); }).map(function (r) { return r.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('dcapb-') === 0; }).map(function (k) { return caches.delete(k); })); }));
    Promise.all(jobs).then(go, go); setTimeout(go, 1500);
  })();
</script></head>
<body style="font:15px -apple-system,system-ui,sans-serif;background:#EDE4D2;color:#1F2422;text-align:center;padding-top:30vh">
La bêta est terminée. <a href="../">Ouvrir DCAP</a> · tu peux supprimer l'icône « DCAP β ».
</body></html>
